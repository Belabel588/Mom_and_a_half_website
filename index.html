<!doctype html>
<!-- lang="he" tells search engines the content is Hebrew, which is what gets it
     surfaced to Hebrew-language searchers. Deliberately NO dir="rtl" here: the
     stylesheets set `direction: rtl` per section against an LTR root, so making
     the root RTL reverses the header nav and swaps the About and Issue photos
     to the wrong sides. dir is presentational only and carries no SEO weight. -->

       and her name ("שרית חלפון") are what people will actually type. -->

       and in public/robots.txt and public/sitemap.xml. If the site moves to a

  <link rel="icon" href="./images/logo-pink-nobcg.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">

    rel="stylesheet">

  <!-- Without this, iOS Safari tints its own top/bottom chrome bars white/gray
       instead of the page's background, leaving a mismatched band around the
       Dynamic Island and home indicator even though the page itself already
       extends under them (viewport-fit=cover, above). White matches the
       AppHeader band that sits at the very top of the page. -->
  <meta name="theme-color" content="#ffffff" />

  <!-- Link previews (WhatsApp, Facebook, etc). These crawlers do not run
       JavaScript, so without them a shared link shows nothing but a bare URL. -->
